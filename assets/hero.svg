<text class="role r0" x="80" y="232" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" fill="#7DCFFF"><tspan fill="#9ECE6A">&gt; </tspan>Full Stack Web Developer</text><text class="role r1" x="80" y="232" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" fill="#7DCFFF"><tspan fill="#9ECE6A">&gt; </tspan>React &amp; Next.js on the front</text><text class="role r2" x="80" y="232" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" fill="#7DCFFF"><tspan fill="#9ECE6A">&gt; </tspan>Node.js, Python &amp; PHP on the back</text><text class="role r3" x="80" y="232" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" fill="#7DCFFF"><tspan fill="#9ECE6A">&gt; </tspan>Learning ML to bring AI into web apps</text>
<rect class="blink" x="80" y="252" width="14" height="4" fill="#7DCFFF"/>
<g transform="translate(80 290)">
  <circle class="dot" cx="6" cy="0" r="5" fill="#9ECE6A"/>
  <text x="20" y="5" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" fill="#7A84A8">github.com/mahedi0x  ·  mahedi.swe04@gmail.com</text>
</g>
<g transform="translate(830 92)">
  <rect width="300" height="186" rx="12" fill="#111729" stroke="#1F2A44"/>
  <circle cx="20" cy="18" r="5" fill="#F7768E"/><circle cx="38" cy="18" r="5" fill="#E0AF68"/><circle cx="56" cy="18" r="5" fill="#9ECE6A"/>
  <text x="280" y="22" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#7A84A8">dev.js</text>
  <text x="20" y="58" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15"><tspan fill="#BB9AF7">const</tspan><tspan fill="#C0CAF5"> dev</tspan><tspan fill="#7A84A8"> = {</tspan></text><text x="20" y="82" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15"><tspan fill="#7AA2F7">  name</tspan><tspan fill="#9ECE6A">: "Mahedi"</tspan><tspan fill="#7A84A8">,</tspan></text><text x="20" y="106" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15"><tspan fill="#7AA2F7">  stack</tspan><tspan fill="#9ECE6A">: "MERN+"</tspan><tspan fill="#7A84A8">,</tspan></text><text x="20" y="130" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15"><tspan fill="#7AA2F7">  coffee</tspan><tspan fill="#FF9E64">: Infinity</tspan><tspan fill="#7A84A8">,</tspan></text><text x="20" y="154" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15"><tspan fill="#7AA2F7">  learning</tspan><tspan fill="#9ECE6A">: "ML"</tspan><tspan fill="#7A84A8"></tspan></text><text x="20" y="178" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15"><tspan fill="#7A84A8">}</tspan><tspan fill="#C0CAF5"></tspan><tspan fill="#7A84A8">;</tspan></text>
</g>
</svg>
